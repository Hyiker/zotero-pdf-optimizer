<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox preference="automatic" data-l10n-id="pref-automatic" />

  <html:label
    for="zotero-prefpane-__addonRef__-cpdf-path"
    data-l10n-id="pref-cpdf-path"
  ></html:label>
  <hbox align="center">
    <html:input
      id="zotero-prefpane-__addonRef__-cpdf-path"
      type="text"
      preference="cpdfPath"
      style="min-width: 28em; flex: 1"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-choose"
      data-l10n-id="pref-choose"
    ></button>
    <button
      id="zotero-prefpane-__addonRef__-detect"
      data-l10n-id="pref-detect"
    ></button>
    <button
      id="zotero-prefpane-__addonRef__-test"
      data-l10n-id="pref-test"
    ></button>
  </hbox>
  <html:pre
    id="zotero-prefpane-__addonRef__-cpdf-status"
    style="white-space: pre-wrap"
  ></html:pre>

  <checkbox preference="squeeze" data-l10n-id="pref-squeeze" />
  <description data-l10n-id="pref-squeeze-description"></description>
  <hbox align="center">
    <html:label
      data-l10n-id="pref-min-percent"
      for="zotero-prefpane-__addonRef__-min-percent"
    ></html:label>
    <html:input
      id="zotero-prefpane-__addonRef__-min-percent"
      type="number"
      min="0"
      step="0.1"
      preference="minSavingsPercent"
    ></html:input>
    <html:span>%</html:span>
  </hbox>
  <hbox align="center">
    <html:label
      data-l10n-id="pref-min-space"
      for="zotero-prefpane-__addonRef__-min-savings-kib"
    ></html:label>
    <html:input
      id="zotero-prefpane-__addonRef__-min-savings-kib"
      type="number"
      min="0"
      step="1"
    ></html:input>
    <html:span>KiB</html:span>
  </hbox>
  <checkbox preference="notifications" data-l10n-id="pref-notifications" />
  <checkbox preference="keepBackup" data-l10n-id="pref-keep-backup" />
  <checkbox preference="debug" data-l10n-id="pref-debug" />
  <description data-l10n-id="pref-signature-warning"></description>
</groupbox>
